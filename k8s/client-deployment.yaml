apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - image: weblabregistry-client:1.0
        name: frontend
        ports:
        - containerPort: 80
        env:
        - name: BACKEND_HOST
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: BACKEND_HOST
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
stringData:
  POSTGRES_PASSWORD: postgres

---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
type: Opaque
stringData:
  ConnectionStrings__Postgres: "Host=postgres-service;Port=5432;Database=labregistry_db;Username=postgres;Password=postgres"
